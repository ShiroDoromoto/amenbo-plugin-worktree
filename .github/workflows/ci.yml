name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The version go.mod asks for, so the gate and the build never run on two Gos.
          go-version-file: go.mod
      - run: make test
